name: Release and Pages

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      - name: install tauri-cli
        # 1.6.6 is the last 1.x release and its lockfile pins time 0.3.37, which
        # compiles on modern rustc. 1.5.14 pinned time 0.3.30, which fails with
        # E0282 (type annotations needed for Box<_>) on rustc >= 1.80.
        run: cargo install tauri-cli --version 1.6.6 --locked
      - name: generate icons
        # tauri.conf.json lives in src-tauri/, so every bundle.icon path resolves
        # to src-tauri/icons/. The repo-root icons/ folder only holds PNGs, so
        # generate the full set (including the missing .ico and .icns) from the
        # 512px source. Output goes to src-tauri/icons/ by default.
        run: cargo tauri icon icons/icon-512.png
      - name: build app
        run: cargo tauri build
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb

  release:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true

  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
